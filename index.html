<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noor Fatima</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --main: #1D3557;
    --text: #14141A;
    --bg: #FAFAF9;
    --accent: #2A9D8F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(2rem, 6vw, 3.2rem);
    color: var(--main);
    letter-spacing: -0.5px;
  }
  p.claim {
    margin-top: 14px;
    font-size: clamp(1rem, 2.5vw, 1.25rem);
    color: var(--text);
    max-width: 560px;
  }
  .accent-line {
    width: 64px;
    height: 4px;
    background: var(--accent);
    border-radius: 2px;
    margin: 22px 0;
  }
  footer {
    position: absolute;
    bottom: 28px;
    font-size: 0.85rem;
    color: #6b6b6b;
  }
</style>
</head>
<body>
  <h1>Noor Fatima</h1>
  <div class="accent-line"></div>
  <p class="claim">Training a model is easy. Shipping one is the job — and that's what I do.</p>
  <footer>Portfolio launching soon.</footer>
</body>
</html>
